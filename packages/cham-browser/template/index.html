<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CHAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/fonts/hanamin-fallback.css" />
  <script>
    (function(){
      var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('layout');if(l)document.documentElement.setAttribute('data-layout',l);
    })();
  </script>
  <style>
    #app-loading{position:fixed;inset:0;background:var(--paper,#faf6ee);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:'Noto Serif TC',serif;transition:opacity .4s ease}
    #app-loading.fade-out{opacity:0;pointer-events:none}
    #app-loading .ld-wrap{position:relative;width:72px;height:72px;overflow:hidden}
    #app-loading .ld-base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:grayscale(1) opacity(.25)}
    #app-loading .ld-liquid{position:absolute;inset:0;overflow:hidden;animation:liquidRise 2.4s ease-in-out infinite}
    #app-loading .ld-liquid::before{content:'';position:absolute;left:-50%;width:200%;height:10px;bottom:calc(100% - 1px);background:var(--paper,#faf6ee);border-radius:43%;animation:waveSway 1s ease-in-out infinite alternate}
    #app-loading .ld-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    #app-loading .ld-char{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;line-height:1}
    #app-loading .ld-char--base{color:#a89b8a;font-family:'Noto Serif TC',serif}
    #app-loading .ld-char--fill{color:var(--vermillion,#c23a2b);font-family:'Noto Serif TC',serif}
    #app-loading .line{width:1px;height:40px;background:linear-gradient(180deg,var(--vermillion,#c23a2b),transparent);margin-top:24px;animation:lineGrow .6s .3s cubic-bezier(.16,1,.3,1) forwards;transform:scaleY(0);transform-origin:top}
    @keyframes liquidRise{0%{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes waveSway{0%{transform:translateX(-5%) rotate(-1deg)}to{transform:translateX(5%) rotate(1deg)}}
    @keyframes lineGrow{to{transform:scaleY(1)}}
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="ld-wrap" id="loading-logo"></div>
    <div class="line"></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
