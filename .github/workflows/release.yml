name: Release

on:
  push:
    tags:
      - 'cham/v*'
      - 'cham-browser/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - cham
          - cham-browser
          - both
      version:
        description: 'Version to release (e.g. 0.2.1)'
        required: true
        type: string

permissions:
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      publish_cham: ${{ steps.detect.outputs.publish_cham }}
      publish_browser: ${{ steps.detect.outputs.publish_browser }}
    steps:
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pkg="${{ inputs.package }}"
            echo "publish_cham=$( [[ "$pkg" == "cham" || "$pkg" == "both" ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "publish_browser=$( [[ "$pkg" == "cham-browser" || "$pkg" == "both" ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          else
            tag="${{ github.ref_name }}"
            echo "publish_cham=$( [[ "$tag" == cham/* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "publish_browser=$( [[ "$tag" == cham-browser/* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          fi

  publish-cham:
    needs: detect
    if: needs.detect.outputs.publish_cham == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/cham
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
      - run: npm publish --provenance
        working-directory: packages/cham

  publish-cham-browser:
    needs: detect
    if: needs.detect.outputs.publish_browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/cham-browser
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
      - run: npm publish --provenance
        working-directory: packages/cham-browser

  github-release:
    needs: [publish-cham, publish-cham-browser]
    permissions:
      contents: write
    if: always() && (needs.publish-cham.result == 'success' || needs.publish-cham-browser.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine tag and label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pkg="${{ inputs.package }}"
            label="${pkg#@hanology/}"
            echo "tag=${label}-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
