name: Release

on:
  push:
    tags:
      - 'cham/v*'
      - 'cham-browser/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - cham
          - cham-browser
          - both
      version:
        description: 'Version to release (e.g. 0.2.1)'
        required: true
        type: string

permissions:
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pkg="${{ inputs.package }}"
            if [ "$pkg" = "both" ]; then
              echo 'matrix=["cham","cham-browser"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$pkg\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            pkg="${{ github.ref_name }}"
            pkg="${pkg%%/*}"
            echo "matrix=[\"$pkg\"]" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: prepare
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/${{ matrix.package }}
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
      - run: npm publish --provenance
        working-directory: packages/${{ matrix.package }}

  github-release:
    needs: publish
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pkg="${{ inputs.package }}"
            echo "tag=${pkg}-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
